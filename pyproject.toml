[project]
name = "the-arena"
version = "0.1.0"
description = "Monte Carlo simulator for the game show 'The Arena' (HaZira)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "numba",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arena", "arena.engine"]

[tool.vercel]
entrypoint = "arena.server:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
